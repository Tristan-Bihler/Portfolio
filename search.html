<section class="section-game">
  <div class="container-narrow">
    <p class="label">Find anything</p>
    <h1 class="section-heading" style="margin-bottom: 36px;">Search</h1>

    <div class="search-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.2" y2="16.2"></line>
      </svg>
      <input type="search" id="search-input" placeholder="Posts, projects, games…"
             autocomplete="off" autofocus data-index="{{ '/search.json' | relative_url }}">
    </div>

    <p class="search-count" id="search-count"></p>
    <div class="search-results" id="search-results"></div>
  </div>
</section>
<script src="{{ '/assets/js/search.js' | relative_url }}"></script>
