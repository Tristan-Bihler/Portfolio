---
layout: default
title: Trail Map
permalink: /map/
---
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<section class="section-game">
  <div class="container">
    <div class="section-header">
      <div>
        <p class="label">Hiking &amp; Travel</p>
        <h1 class="section-heading">Trail Map</h1>
      </div>
      <p class="game-tagline">Every trip on one map — zoom in for the photos.<br>Routes are approximate, memories aren't.</p>
    </div>

    <div class="map-frame">
      <div class="card-top-bar"></div>
      <div id="trail-map" data-photos="{{ '/photo-map.json' | relative_url }}"></div>
    </div>

    <div class="map-trips" id="map-trips"></div>
  </div>
</section>

<script id="trip-data" type="application/json">
[
  {% assign mapped = site.posts | where_exp: "p", "p.map" %}
  {% for post in mapped %}
  {
    "title": {{ post.title | jsonify }},
    "url": {{ post.url | relative_url | jsonify }},
    "date": {{ post.date | date: "%B %Y" | jsonify }},
    "category": {{ post.category | jsonify }},
    "points": {{ post.map.points | jsonify }},
    "route": {{ post.map.route | jsonify }},
    "gpx": {{ post.map.gpx | jsonify }}
  }{% unless forloop.last %},{% endunless %}
  {% endfor %}
]
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="{{ '/assets/js/map.js' | relative_url }}"></script>
